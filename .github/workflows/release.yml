name: Release kiosk binary

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "kiosk/**"
      - ".github/workflows/release.yml"

permissions:
  contents: read

concurrency:
  group: kiosk-${{ github.event_name == 'push' && 'release' || github.ref }}
  cancel-in-progress: false

jobs:
  prepare-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.version.outputs.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && 'master' || github.sha }}
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Test release preparation
        run: python kiosk/scripts/test-release.py

      - name: Commit release version and update tag
        if: github.event_name == 'push'
        id: version
        run: bash kiosk/scripts/prepare-release.sh

  build-kiosk:
    needs: prepare-release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.prepare-release.outputs.sha || github.sha }}

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: kiosk/src-tauri -> target

      - name: Test kiosk
        working-directory: kiosk/src-tauri
        run: cargo test --locked

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: kiosk
          args: -- --locked

      - name: Verify static Visual C++ runtime
        shell: pwsh
        run: ./kiosk/scripts/check-windows-runtime.ps1

      - name: Upload PR installers
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: kiosk-installers
          if-no-files-found: error
          path: |
            kiosk/src-tauri/target/release/bundle/msi/*.msi
            kiosk/src-tauri/target/release/bundle/nsis/*-setup.exe

      # Publish only after checking the executable used in these installers.
      - name: Publish installers
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          target_commitish: ${{ needs.prepare-release.outputs.sha }}
          name: ${{ github.ref_name }}
          body: Kiosk binary for stadium screens. Install the .msi or .exe on the target Windows machine.
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            kiosk/src-tauri/target/release/bundle/msi/*.msi
            kiosk/src-tauri/target/release/bundle/nsis/*-setup.exe
