name: Release kiosk binary

on:
  push:
    tags:
      - "v*"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "kiosk/**"
      - ".github/workflows/release.yml"

permissions:
  contents: write

jobs:
  build-kiosk:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: kiosk/src-tauri -> target

      - name: Test kiosk
        working-directory: kiosk/src-tauri
        run: cargo test --locked

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: kiosk
          args: -- --locked

      - name: Verify static Visual C++ runtime
        shell: pwsh
        run: ./kiosk/scripts/check-windows-runtime.ps1

      # Publish only after checking the executable used in these installers.
      - name: Publish installers
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'push' && github.ref_name || format('pr-{0}-{1}', github.event.pull_request.number, github.sha) }}
          target_commitish: ${{ github.sha }}
          name: ${{ github.event_name == 'push' && github.ref_name || format('PR {0} build', github.event.pull_request.number) }}
          body: ${{ github.event_name == 'push' && 'Kiosk binary for stadium screens. Install the .msi or .exe on the target Windows machine.' || format('Pre-release kiosk build from PR {0}. For testing only.', github.event.pull_request.number) }}
          draft: false
          prerelease: ${{ github.event_name == 'pull_request' }}
          fail_on_unmatched_files: true
          files: |
            kiosk/src-tauri/target/release/bundle/msi/*.msi
            kiosk/src-tauri/target/release/bundle/nsis/*-setup.exe
